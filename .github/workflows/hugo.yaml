name: Build and deploy Hugo site

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
      TZ: Asia/Shanghai

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        run: |
          curl -L -o "${RUNNER_TEMP}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${RUNNER_TEMP}/hugo.tar.gz" -C "${RUNNER_TEMP}/hugo"
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"
      - name: Verify Hugo
        run: hugo version

      - name: Build
        run: |
          hugo --gc --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${RUNNER_TEMP}/hugo_cache"
      - name: Verify generated site
        run: |
          test -f public/index.html
          test -f public/index.xml
          test -f public/admin/index.html
          test -f public/admin/config.yml
          test -f public/archive/index.html
          test -f public/about/index.html
          test -f public/search/index.html
          grep -R "博客已上线" public/index.html public/post -n
          grep -R "搜索功能暂未启用" public/search -n
          grep -R "background-image:url(${{ steps.pages.outputs.base_path }}/img/home-bg.jpg)" public/post -n
          if grep -R "yourgithub\|youremail\|xxx.xxx.com" public -n; then exit 1; fi
      - name: Verify root and project Pages paths
        run: |
          hugo --gc --minify --baseURL "https://example.github.io/" --destination "${RUNNER_TEMP}/site-root"
          hugo --gc --minify --baseURL "https://example.github.io/example-repo/" --destination "${RUNNER_TEMP}/site-project"
          grep -R 'href=/archive/' "${RUNNER_TEMP}/site-root/index.html" -n
          grep -R 'href=/example-repo/archive/' "${RUNNER_TEMP}/site-project/index.html" -n
          grep -R 'background-image:url(/example-repo/img/home-bg.jpg)' "${RUNNER_TEMP}/site-project/post" -n
          grep -R 'example-repo/css/custom.css' "${RUNNER_TEMP}/site-project" -n
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
